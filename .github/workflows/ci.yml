name: Azure Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-and-hygiene-scan:
    name: Secret & Artifact Hygiene Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail on tracked secrets or publish profiles
        run: |
          set -euo pipefail
          if git ls-files '.env' '.env.*' '*.pfx' '*.pem' '*.key' '*.crt' '*.publishsettings' 'backups/*' 'nginx/ssl/*' | grep -v '\.example$' | grep -q .; then
            echo "ERROR: Tracked secret, certificate, or publish profile detected."
            exit 1
          fi
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  payload-and-script-lint:
    name: Payload Hygiene, XML, ShellCheck & Hadolint
    needs: secret-and-hygiene-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libxml2-utils & verify payload
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
          bash ./tests/payload/verify-payload.sh
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh tests/payload/verify-payload.sh
      - name: Lint Site Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: site/Dockerfile

  bicep-lint-build-and-compliance:
    name: Bicep Lint, Build, PSRule & Trivy Config
    needs: secret-and-hygiene-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint & build Bicep templates
        run: |
          az bicep version
          az bicep lint --file infra/bicep/main.bicep
          az bicep build --file infra/bicep/main.bicep --outfile /tmp/main.json
          for p in infra/bicep/parameters/*.bicepparam; do
            echo "Building params: $p"
            az bicep build-params --file "$p" --outfile "/tmp/$(basename "$p").json"
          done
      - name: Trivy IaC Config Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/bicep
          severity: HIGH,CRITICAL
          exit-code: "1"

  powershell-lint-and-pester:
    name: PowerShell ScriptAnalyzer & Pester Tests
    needs: secret-and-hygiene-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PSScriptAnalyzer & Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer, Pester -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path infra/iaas/scripts -Severity Error -Recurse
          if ($issues) {
            $issues | Format-Table -AutoSize
            exit 1
          }
          Invoke-Pester -Path tests/iaas/iis-scripts.Tests.ps1 -CI

  docker-build-scan-smoke:
    name: Container Build, Trivy Scan & Compose TLS Smoke Test
    needs: [payload-and-script-lint, bicep-lint-build-and-compliance, powershell-lint-and-pester]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Verification Payload Image
        uses: docker/build-push-action@v6
        with:
          context: ./site
          load: true
          tags: azure-web-payload:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            GIT_SHA=${{ github.sha }}
            DEPLOYMENT_TRACK=ci-smoke
            ENVIRONMENT=ci
      - name: Trivy OS Scan (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: azure-web-payload:${{ github.sha }}
          vuln-type: os
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Run Compose TLS Smoke Test
        run: |
          set -euo pipefail
          cat > .env <<EOF
          APP_HOST=localhost
          APP_VERSION=${{ github.sha }}
          GIT_SHA=${{ github.sha }}
          DEPLOYMENT_TRACK=ci-smoke
          ENVIRONMENT=ci
          EOF
          bash ./scripts/generate-ssl.sh localhost
          trap 'docker compose ps -a; docker compose logs --no-color; docker compose down -v' EXIT
          docker compose up -d --no-build
          bash ./scripts/smoke-test.sh https://localhost "${{ github.sha }}"
