services:
  site:
    build:
      context: ./site
      args:
        APP_VERSION: ${APP_VERSION:-local-dev}
        GIT_SHA: ${GIT_SHA:-local}
        DEPLOYMENT_TRACK: ${DEPLOYMENT_TRACK:-local-docker}
        ENVIRONMENT: ${ENVIRONMENT:-local}
    image: azure-web-payload:${APP_VERSION:-local-dev}
    restart: unless-stopped
    networks:
      - web-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27.4-alpine
    restart: unless-stopped
    depends_on:
      site:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_HOST: ${APP_HOST:-localhost}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - web-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web-net:
    driver: bridge
